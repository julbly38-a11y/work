<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upwork: вакансії</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --text: #1d1d1b; --muted: #6f6b61; --border: #e4dfd3;
    --accent: #2f6b4f; --sel: #e3efe7; --tile: #ebe6da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161815; --card: #1e211d; --text: #ece9e1; --muted: #9a968a; --border: #31342e; --accent: #7fc4a0; --sel: #26352c; --tile: #2a2d27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  #count { color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 12px; margin-bottom: 16px; }
  input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  input { flex: 1; min-width: 0; }
  .filters.wrap { flex-wrap: wrap; gap: 8px; }
  .filters.wrap select { padding: 7px 10px; font-size: 13px; }
  #reset { font: inherit; font-size: 13px; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: 7px 12px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { font: inherit; font-size: 12px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .chip b { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .chip.on { background: var(--accent); color: var(--card); border-color: var(--accent); }
  .chip.on b { color: inherit; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .badges span { background: var(--tile); border-radius: 4px; padding: 0 6px; font-size: 11px; color: var(--muted); }
  .badges .hot { background: var(--sel); color: var(--accent); }
  .item .row { display: flex; justify-content: space-between; gap: 8px; }
  .item .go { color: var(--accent); font-size: 12px; white-space: nowrap; text-decoration: none; }
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #login[hidden], main[hidden] { display: none; }
  #loginForm { display: grid; gap: 10px; width: 100%; max-width: 340px; }
  #loginForm button, #logout { font: inherit; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--card); cursor: pointer; }
  #logout { background: none; color: var(--muted); padding: 0 0 0 12px; font-size: 13px; }
  #loginErr { color: #b3261e; margin: 0; min-height: 1.4em; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--card); border-color: var(--accent); }
  #marketView[hidden], #upworkView[hidden] { display: none; }
  .post { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; color: inherit; text-decoration: none; }
  .post:hover { border-color: var(--accent); }
  .post summary { cursor: pointer; list-style: none; }
  .post summary::-webkit-details-marker { display: none; }
  .post .body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .post .body > a { display: inline-block; margin-bottom: 12px; color: var(--accent); font-size: 14px; }
  .post .body .cols p { font-size: 14px; }
  .post b { display: block; font-weight: 600; }
  .post small { color: var(--muted); font-size: 12px; }
  .post .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .post .tags span { background: var(--tile); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .layout { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 16px; align-items: start; }
  #list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; max-height: calc(100vh - 160px); overflow-y: auto; }
  .item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; padding: 12px 14px; cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.on { background: var(--sel); border-left-color: var(--accent); }
  .item b { font-weight: 600; display: block; }
  .item small { color: var(--muted); font-size: 12px; }
  #detail { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; position: sticky; top: 16px; max-height: calc(100vh - 160px); overflow-y: auto; }
  #detail h2 { margin: 0 0 4px; font-size: 20px; }
  .top { display: flex; justify-content: space-between; gap: 12px; }
  .top a { color: var(--accent); white-space: nowrap; font-size: 14px; }
  .orig { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .tile { background: var(--tile); border-radius: 6px; padding: 6px 10px; }
  .tile span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cols h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
  .cols p { margin: 0; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    #list, #detail { max-height: none; position: static; }
    .cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>Upwork: вакансії</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button>Увійти</button>
    <p id="loginErr" role="alert"></p>
  </form>
</div>
<main hidden>
  <header><h1>Вакансії</h1><span><span id="count" class="mono"></span><button id="logout" type="button">Вийти</button></span></header>
  <nav class="tabs"><button class="tab on" data-tab="upwork">Upwork</button><button class="tab" data-tab="market">Ринок праці</button><button class="tab" data-tab="clients">Замовники</button></nav>
  <div id="upworkView">
  <div class="filters">
    <input id="q" placeholder="Пошук: назва, запит, оплата">
    <select id="country"><option value="">Усі країни клієнта</option></select>
  </div>
  <div class="filters wrap">
    <select id="ftype"><option value="">Тип оплати</option><option value="hourly">Погодинно</option><option value="fixed">Фікс</option></select>
    <select id="fbudget"><option value="">Бюджет</option></select>
    <select id="ftopic"><option value="">Тема</option></select>
    <select id="fprop"><option value="">Конкуренція</option></select>
    <select id="fclient"><option value="">Клієнт</option></select>
    <select id="fperiod"><option value="">Увесь період</option><option value="7">7 днів</option><option value="30">30 днів</option><option value="90">90 днів</option></select>
    <select id="fsort"><option value="date">Спершу нові</option><option value="best">Кращі можливості</option><option value="budget">Найбільший бюджет</option><option value="prop">Найменше заявок</option></select>
    <button id="reset" type="button">Скинути</button>
  </div>
  <div id="chips" class="chips"></div>
  <div class="layout">
    <div id="list"></div>
    <article id="detail"></article>
  </div>
  </div>
  <section id="clientsView" hidden>
    <div class="filters wrap">
      <input id="cq" placeholder="Пошук: назва, країна, вакансія">
      <select id="cscore"><option value="">Оцінка</option><option value="5">5</option><option value="4">4 і вище</option><option value="3">3 і вище</option></select>
      <select id="cfit"><option value="">Відповідність</option><option value="4">4 і вище</option><option value="3">3 і вище</option></select>
      <select id="ccountry"><option value="">Усі країни</option></select>
      <select id="csort"><option value="score">За оцінкою</option><option value="spend">За витратами</option><option value="fit">За відповідністю</option><option value="new">Найновіші</option></select>
      <label class="meta"><input id="cwatch" type="checkbox"> лише «стежити»</label>
    </div>
    <p id="cstate" class="meta mono"></p>
    <div id="clist"></div>
  </section>
  <section id="marketView" hidden>
    <div class="filters"><input id="mq" placeholder="Пошук: назва, компанія, тег"><select id="msrc"><option value="">Усі джерела</option></select></div>
    <p id="mstate" class="meta mono"></p>
    <div id="mlist"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = d => new Date(d).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let JOBS = [];
let current = location.hash.slice(1);

const SB = 'https://ubjnztanehqlsrqphdqy.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViam56dGFuZWhxbHNycXBoZHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzMxNzQsImV4cCI6MjA5ODkwOTE3NH0.f1AkxeeZfO0wAQrrhzWjTTE9NTMrTIc8xILfEPC93p0';
const store = {
  get() { try { return JSON.parse(localStorage.getItem('sb-session')); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('sb-session', JSON.stringify(v)) : localStorage.removeItem('sb-session'); } catch {} },
};
const auth = (path, body) => fetch(SB + '/auth/v1/' + path, { method: 'POST', headers: { apikey: ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function refresh() {
  const s = store.get(); if (!s?.refresh_token) return false;
  const r = await auth('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
  if (!r.ok) return false;
  store.set(await r.json()); return true;
}

function showLogin(msg = '') {
  document.querySelector('main').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg;
}

// Живі дані з /api/vacancies (Supabase, лише для власника); локально з file:// — запасний data.js
async function fetchJobs() {
  const get = () => fetch('/api/vacancies', { headers: { Authorization: 'Bearer ' + (store.get()?.access_token || '') } });
  let r = await get();
  if (r.status === 401 && await refresh()) r = await get();
  return r;
}

async function load() {
  try {
    const r = await fetchJobs();
    if (r.status === 401) { store.set(null); return showLogin(); }
    if (!r.ok) throw new Error(r.status);
    JOBS = await r.json();
  } catch {
    await new Promise(ok => { const s = document.createElement('script'); s.src = 'data.js'; s.onload = s.onerror = ok; document.head.append(s); });
    JOBS = window.JOBS_SNAPSHOT || [];
  }
  $('login').hidden = true; document.querySelector('main').hidden = false;
  JOBS.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  current = current || JOBS[0]?.id;
  JOBS.forEach(enrich);
  $('country').insertAdjacentHTML('beforeend', [...new Set(JOBS.map(j => j.country))].sort().map(c => `<option>${esc(c)}</option>`).join(''));
  const opts = (id, arr) => $(id).insertAdjacentHTML('beforeend', arr.map(v => `<option>${esc(v)}</option>`).join(''));
  opts('fbudget', [...FIXED, ...HOURLY, NOBUDGET]); opts('ftopic', TOPICS.map(t => t[0])); opts('fprop', PROPS); opts('fclient', CLIENTS);
  render();
}

// ---- Категоризація (на клієнті, з наявних полів) ----
const FIXED = ['Фікс < $100', 'Фікс $100–299', 'Фікс $300–499', 'Фікс $500–999', 'Фікс $1k+'];
const HOURLY = ['Ставка < $15/год', 'Ставка $15–29/год', 'Ставка $30–49/год', 'Ставка $50+/год'];
const NOBUDGET = 'Бюджет не вказано';
const PROPS = ['Fewer than 5', '5 to 10', '10 to 15', '15 to 20', '20 to 50', '50+'];
const CLIENTS = ['Сильний клієнт', 'Перевірений клієнт', 'Новий клієнт'];
const TOPICS = [
  ['HIPAA / безпека', /hipaa|\bphi\b|complian|privacy|security/i],
  ['EHR / athenahealth / FHIR', /\behr\b|\bemr\b|athena|epic\b|cerner|fhir|hl7|interoperab/i],
  ['Data engineering / ETL', /data engineer|\betl\b|\belt\b|pipeline|airflow|\bdbt\b|warehouse|snowflake|bigquery|databricks/i],
  ['Supabase / Postgres / SQL', /supabase|postgres|\bsql\b|row.level|database/i],
  ['Веб (Next.js / React)', /next\.?js|react|full.?stack|web app|front.?end|node/i],
  ['AI / LLM / автоматизація', /\bai\b|llm|gpt|claude|openai|machine learning|agent|automation|chatbot/i],
  ['Скрейпінг / парсинг', /scrap|crawl|extract|parsing/i],
  ['Аналітика / BI', /analytic|dashboard|power bi|tableau|looker|reporting|\bbi\b/i],
  ['Клінічна / медична сфера', /clinical|medical|health|physician|patient|trial|pharma|hospital/i],
];
const KEYS = [['HIPAA', /hipaa|\bphi\b/i], ['athenahealth', /athena/i], ['FHIR', /fhir|hl7/i], ['Supabase', /supabase/i], ['Postgres', /postgres/i], ['Next.js', /next\.?js/i], ['Python', /python/i]];

function enrich(j) {
  const nums = (j.pay.match(/\d[\d,]*\.?\d*/g) || []).map(n => parseFloat(n.replace(/,/g, '')));
  const hi = nums.length ? Math.max(...nums) : 0;
  j._hourly = j.type ? j.type === 'hourly' : /год/.test(j.pay);
  j._hi = hi;
  j._budget = !nums.length ? NOBUDGET
    : j._hourly ? HOURLY[hi < 15 ? 0 : hi < 30 ? 1 : hi < 50 ? 2 : 3]
    : FIXED[hi < 100 ? 0 : hi < 300 ? 1 : hi < 500 ? 2 : hi < 1000 ? 3 : 4];
  const text = [j.title, j.en.slice(0, 1500)].join(' ');
  j._topics = TOPICS.filter(t => t[1].test(text)).map(t => t[0]);
  j._keys = KEYS.filter(k => k[1].test(text)).map(k => k[0]);
  const spent = Number(j.client.spent_usd) || 0, hire = Number(j.client.hire_rate_pct) || 0;
  j._client = spent >= 10000 && hire >= 60 ? CLIENTS[0] : spent >= 1000 ? CLIENTS[1] : CLIENTS[2];
  j._prop = PROPS.includes(j.proposals) ? j.proposals : '';
  j._age = j.date ? (Date.now() - new Date(j.date)) / 864e5 : 9999;
  j._score = ({ 'Fewer than 5': 3, '5 to 10': 2, '10 to 15': 1 }[j.proposals] || 0)
    + (j._client === CLIENTS[0] ? 2 : j._client === CLIENTS[1] ? 1 : 0)
    + ((j._hourly ? hi >= 30 : hi >= 500) ? 2 : 0) + Math.min(j._keys.length, 3);
}

const FILTERS = { ftype: j => (j._hourly ? 'hourly' : 'fixed'), fbudget: j => j._budget, fprop: j => j._prop, fclient: j => j._client };
const SORTS = {
  date: (a, b) => (b.date || '').localeCompare(a.date || ''),
  best: (a, b) => b._score - a._score || SORTS.date(a, b),
  budget: (a, b) => (b._hourly ? b._hi * 160 : b._hi) - (a._hourly ? a._hi * 160 : a._hi),
  prop: (a, b) => (PROPS.indexOf(a.proposals) + 1 || 99) - (PROPS.indexOf(b.proposals) + 1 || 99) || SORTS.date(a, b),
};

function filtered(skipTopic) {
  const q = $('q').value.trim().toLowerCase(), c = $('country').value, t = $('ftopic').value, p = +$('fperiod').value;
  return JOBS.filter(j => (!c || j.country === c)
    && Object.entries(FILTERS).every(([id, fn]) => !$(id).value || fn(j) === $(id).value)
    && (skipTopic || !t || j._topics.includes(t))
    && (!p || j._age <= p)
    && (!q || [j.title, j.title_uk, j.pay, j.en, j.uk].join(' ').toLowerCase().includes(q)));
}

function render() {
  const list = filtered().sort(SORTS[$('fsort').value]);
  $('count').textContent = `${list.length} з ${JOBS.length}`;
  const topicCounts = TOPICS.map(t => [t[0], filtered(true).filter(j => j._topics.includes(t[0])).length]);
  $('chips').innerHTML = topicCounts.map(([n, k]) => `<button class="chip ${$('ftopic').value === n ? 'on' : ''}" data-topic="${esc(n)}">${esc(n)}<b>${k}</b></button>`).join('');
  $('list').innerHTML = list.length ? list.map(j => `
    <button class="item ${j.id === current ? 'on' : ''}" data-id="${esc(j.id)}">
      <div class="row"><b>${esc(j.title_uk || j.title)}</b>${/^https?:\/\//.test(j.url) ? `<a class="go" href="${esc(j.url)}" target="_blank" rel="noopener" title="Відкрити на Upwork">↗</a>` : ''}</div>
      <small class="mono">${esc(j.pay)} · ${esc(j.country)} · ${fmt(j.date)}${j.proposals ? ` · заявок ${esc(j.proposals)}` : ''}</small>
      <div class="badges">${j._score >= 6 ? '<span class="hot">★ кращі</span>' : ''}${[...j._topics.slice(0, 2), ...j._keys].map(x => `<span>${esc(x)}</span>`).join('')}</div>
    </button>`).join('') : '<div class="empty">Нічого не знайдено</div>';

  const j = JOBS.find(j => j.id === current);
  if (!j) { $('detail').innerHTML = '<div class="empty">Оберіть вакансію</div>'; return; }
  const tiles = Object.entries(j.client).map(([k, v]) => `<div class="tile"><span class="mono">${esc(k.toUpperCase())}</span>${esc(v)}</div>`).join('');
  const link = /^https?:\/\//.test(j.url) ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">Відкрити на Upwork ↗</a>` : '';
  $('detail').innerHTML = `
    <div class="top"><h2>${esc(j.title_uk || j.title)}</h2>${link}</div>
    ${j.title_uk ? `<div class="orig">${esc(j.title)}</div>` : ''}
    <div class="meta mono">${esc(j.pay)}${j.proposals ? ` · заявок ${esc(j.proposals)}` : ''} · опубліковано ${fmt(j.date)}</div>
    ${tiles ? `<div class="tiles mono">${tiles}</div>` : ''}
    <div class="cols">
      <section><h3 class="mono">Англійська (оригінал)</h3><p>${esc(j.en)}</p></section>
      <section><h3 class="mono">Українська (переклад)</h3><p>${esc(j.uk)}</p></section>
    </div>`;
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  current = b.dataset.id; history.replaceState(null, '', '#' + current); render();
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('ftopic').value = $('ftopic').value === b.dataset.topic ? '' : b.dataset.topic; render();
});
$('reset').addEventListener('click', () => {
  ['q', 'country', 'ftype', 'fbudget', 'ftopic', 'fprop', 'fclient', 'fperiod'].forEach(id => $(id).value = '');
  $('fsort').value = 'date'; render();
});
['q'].forEach(id => $(id).addEventListener('input', render));
['country', 'ftype', 'fbudget', 'ftopic', 'fprop', 'fclient', 'fperiod', 'fsort'].forEach(id => $(id).addEventListener('change', render));
let MARKET = null;
async function loadMarket() {
  if (!MARKET) {
    const get = () => fetch('/api/market', { headers: { Authorization: 'Bearer ' + (store.get()?.access_token || '') } });
    let r = await get();
    if (r.status === 401 && await refresh()) r = await get();
    if (r.status === 401) { store.set(null); return showLogin(); }
    MARKET = r.ok ? await r.json() : { postings: [], state: null };
    $('msrc').insertAdjacentHTML('beforeend', [...new Set(MARKET.postings.map(p => p.source))].sort().map(c => `<option>${esc(c)}</option>`).join(''));
  }
  renderMarket();
}
function renderMarket() {
  const q = $('mq').value.trim().toLowerCase(), src = $('msrc').value;
  const list = MARKET.postings.filter(p => (!src || p.source === src) && (!q || [p.title, p.title_uk, p.company, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q)));
  const st = MARKET.state;
  $('mstate').textContent = `${list.length} з ${MARKET.postings.length}` + (st?.last_run ? ` · оновлено ${new Date(st.last_run).toLocaleString('uk-UA')} · нових за запуск: ${st.last_new ?? 0}` : '');
  $('mlist').innerHTML = list.length ? list.map(p => `
    <details class="post">
      <summary>
        <b>${esc(p.title_uk || p.title)}</b>
        <small class="mono">${[p.title_uk ? p.title : '', p.company, p.location, p.salary, p.source, p.posted_at ? fmt(p.posted_at) : ''].filter(Boolean).map(esc).join(' · ')}</small>
        ${(p.matched || []).length ? `<div class="tags">${p.matched.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      </summary>
      <div class="body">
        ${/^https?:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">Відкрити оригінал ↗</a>` : ''}
        ${p.description_uk || p.description_en ? `<div class="cols">
          <section><h3 class="mono">Англійська (оригінал)</h3><p>${esc(p.description_en || '')}</p></section>
          <section><h3 class="mono">Українська (переклад)</h3><p>${p.description_uk ? esc(p.description_uk) : '<i>переклад ще не готовий</i>'}</p></section>
        </div>` : '<p class="meta">Опису немає</p>'}
      </div>
    </details>`).join('') : '<div class="empty">Нічого не знайдено</div>';
}
let CLIENT_ROWS = null;
async function loadClients() {
  if (!CLIENT_ROWS) {
    const get = () => fetch('/api/clients', { headers: { Authorization: 'Bearer ' + (store.get()?.access_token || '') } });
    let r = await get();
    if (r.status === 401 && await refresh()) r = await get();
    if (r.status === 401) { store.set(null); return showLogin(); }
    CLIENT_ROWS = r.ok ? (await r.json()).clients : [];
    $('ccountry').insertAdjacentHTML('beforeend', [...new Set(CLIENT_ROWS.map(c => c.country).filter(Boolean))].sort().map(c => `<option>${esc(c)}</option>`).join(''));
  }
  renderClients();
}
const usd = n => n == null ? '—' : '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
function renderClients() {
  const q = $('cq').value.trim().toLowerCase(), sc = +$('cscore').value, ft = +$('cfit').value, ct = $('ccountry').value, w = $('cwatch').checked;
  const jobsText = c => (c.past_jobs || []).map(j => j.title).join(' ');
  const list = CLIENT_ROWS.filter(c => (!sc || c.score >= sc) && (!ft || c.our_fit >= ft) && (!ct || c.country === ct) && (!w || c.watch)
    && (!q || [c.display_name, c.country, c.verdict, jobsText(c)].join(' ').toLowerCase().includes(q)));
  const by = { score: (a, b) => b.score - a.score || (b.spend_total_usd || 0) - (a.spend_total_usd || 0),
    spend: (a, b) => (b.spend_total_usd || 0) - (a.spend_total_usd || 0),
    fit: (a, b) => b.our_fit - a.our_fit || b.score - a.score,
    new: (a, b) => String(b.first_seen).localeCompare(String(a.first_seen)) };
  list.sort(by[$('csort').value]);
  $('cstate').textContent = `${list.length} з ${CLIENT_ROWS.length}`;
  $('clist').innerHTML = list.length ? list.slice(0, 300).map(c => `
    <details class="post">
      <summary>
        <b>${c.watch ? '★ ' : ''}${esc(c.display_name || '—')}</b>
        <small class="mono">оцінка ${c.score}/5 · відповідність ${c.our_fit}/5 · ${usd(c.spend_total_usd)} · ${[c.feedback_score && c.feedback_score + '★ (' + (c.feedback_count || 0) + ')', c.hire_rate_pct != null && 'hire ' + c.hire_rate_pct + '%', c.country].filter(Boolean).map(esc).join(' · ')}</small>
      </summary>
      <div class="body">
        <p>${esc(c.verdict || '')}</p>
        ${c.seasonality ? `<p class="meta">Сезонність: ${esc(c.seasonality)}</p>` : ''}
        ${c.hires_within_minutes != null ? `<p class="meta">Наймає за ~${esc(c.hires_within_minutes)} хв</p>` : ''}
        <h3 class="mono">Його вакансії (${(c.past_jobs || []).length})</h3>
        <ul>${(c.past_jobs || []).slice(0, 10).map(j => `<li>${/^https?:\/\//.test(j.url || '') ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title || '—')} ↗</a>` : esc(j.title || '—')} <small class="mono">${esc([j.date, j.budget].filter(Boolean).join(' · '))}</small></li>`).join('')}</ul>
        ${c.notes ? `<p class="meta">${esc(c.notes)}</p>` : ''}
      </div>
    </details>`).join('') + (list.length > 300 ? '<div class="empty">Показано перші 300; уточніть фільтри</div>' : '') : '<div class="empty">Нічого не знайдено</div>';
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t));
  const tab = t.dataset.tab;
  $('upworkView').hidden = tab !== 'upwork'; $('marketView').hidden = tab !== 'market'; $('clientsView').hidden = tab !== 'clients';
  $('count').style.display = tab === 'upwork' ? '' : 'none';
  if (tab === 'market') loadMarket();
  if (tab === 'clients') loadClients();
});
['cq'].forEach(id => $(id).addEventListener('input', () => CLIENT_ROWS && renderClients()));
['cscore', 'cfit', 'ccountry', 'csort', 'cwatch'].forEach(id => $(id).addEventListener('change', () => CLIENT_ROWS && renderClients()));
$('mq').addEventListener('input', () => MARKET && renderMarket());
$('msrc').addEventListener('change', () => MARKET && renderMarket());

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  const r = await auth('token?grant_type=password', { email: $('email').value.trim(), password: $('password').value });
  if (!r.ok) return showLogin('Невірний email або пароль');
  store.set(await r.json()); $('password').value = '';
  const ok = await fetchJobs();
  if (!ok.ok) { store.set(null); return showLogin('Доступ лише для власника'); }
  load();
});
$('logout').addEventListener('click', () => { store.set(null); location.reload(); });
load();
</script>
</body>
</html>
