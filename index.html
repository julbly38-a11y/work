<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upwork: вакансії</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --text: #1d1d1b; --muted: #6f6b61; --border: #e4dfd3;
    --accent: #2f6b4f; --sel: #e3efe7; --tile: #ebe6da;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161815; --card: #1e211d; --text: #ece9e1; --muted: #9a968a; --border: #31342e; --accent: #7fc4a0; --sel: #26352c; --tile: #2a2d27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  #count { color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 12px; margin-bottom: 16px; }
  input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  input { flex: 1; min-width: 0; }
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #login[hidden], main[hidden] { display: none; }
  #loginForm { display: grid; gap: 10px; width: 100%; max-width: 340px; }
  #loginForm button, #logout { font: inherit; padding: 10px 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--card); cursor: pointer; }
  #logout { background: none; color: var(--muted); padding: 0 0 0 12px; font-size: 13px; }
  #loginErr { color: #b3261e; margin: 0; min-height: 1.4em; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--card); border-color: var(--accent); }
  #marketView[hidden], #upworkView[hidden] { display: none; }
  .post { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; color: inherit; text-decoration: none; }
  .post:hover { border-color: var(--accent); }
  .post b { display: block; font-weight: 600; }
  .post small { color: var(--muted); font-size: 12px; }
  .post .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .post .tags span { background: var(--tile); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .layout { display: grid; grid-template-columns: minmax(280px, 400px) 1fr; gap: 16px; align-items: start; }
  #list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; max-height: calc(100vh - 160px); overflow-y: auto; }
  .item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid var(--border); border-left: 3px solid transparent; padding: 12px 14px; cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.on { background: var(--sel); border-left-color: var(--accent); }
  .item b { font-weight: 600; display: block; }
  .item small { color: var(--muted); font-size: 12px; }
  #detail { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; position: sticky; top: 16px; max-height: calc(100vh - 160px); overflow-y: auto; }
  #detail h2 { margin: 0 0 4px; font-size: 20px; }
  .top { display: flex; justify-content: space-between; gap: 12px; }
  .top a { color: var(--accent); white-space: nowrap; font-size: 14px; }
  .orig { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .tile { background: var(--tile); border-radius: 6px; padding: 6px 10px; }
  .tile span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .cols h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
  .cols p { margin: 0; white-space: pre-wrap; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    #list, #detail { max-height: none; position: static; }
    .cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h1>Upwork: вакансії</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button>Увійти</button>
    <p id="loginErr" role="alert"></p>
  </form>
</div>
<main hidden>
  <header><h1>Вакансії</h1><span><span id="count" class="mono"></span><button id="logout" type="button">Вийти</button></span></header>
  <nav class="tabs"><button class="tab on" data-tab="upwork">Upwork</button><button class="tab" data-tab="market">Ринок праці</button></nav>
  <div id="upworkView">
  <div class="filters">
    <input id="q" placeholder="Пошук: назва, запит, оплата">
    <select id="country"><option value="">Усі країни клієнта</option></select>
  </div>
  <div class="layout">
    <div id="list"></div>
    <article id="detail"></article>
  </div>
  </div>
  <section id="marketView" hidden>
    <div class="filters"><input id="mq" placeholder="Пошук: назва, компанія, тег"><select id="msrc"><option value="">Усі джерела</option></select></div>
    <p id="mstate" class="meta mono"></p>
    <div id="mlist"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = d => new Date(d).toLocaleDateString('uk-UA', { day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let JOBS = [];
let current = location.hash.slice(1);

const SB = 'https://ubjnztanehqlsrqphdqy.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InViam56dGFuZWhxbHNycXBoZHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMzMxNzQsImV4cCI6MjA5ODkwOTE3NH0.f1AkxeeZfO0wAQrrhzWjTTE9NTMrTIc8xILfEPC93p0';
const store = {
  get() { try { return JSON.parse(localStorage.getItem('sb-session')); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('sb-session', JSON.stringify(v)) : localStorage.removeItem('sb-session'); } catch {} },
};
const auth = (path, body) => fetch(SB + '/auth/v1/' + path, { method: 'POST', headers: { apikey: ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function refresh() {
  const s = store.get(); if (!s?.refresh_token) return false;
  const r = await auth('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
  if (!r.ok) return false;
  store.set(await r.json()); return true;
}

function showLogin(msg = '') {
  document.querySelector('main').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg;
}

// Живі дані з /api/vacancies (Supabase, лише для власника); локально з file:// — запасний data.js
async function fetchJobs() {
  const get = () => fetch('/api/vacancies', { headers: { Authorization: 'Bearer ' + (store.get()?.access_token || '') } });
  let r = await get();
  if (r.status === 401 && await refresh()) r = await get();
  return r;
}

async function load() {
  try {
    const r = await fetchJobs();
    if (r.status === 401) { store.set(null); return showLogin(); }
    if (!r.ok) throw new Error(r.status);
    JOBS = await r.json();
  } catch {
    await new Promise(ok => { const s = document.createElement('script'); s.src = 'data.js'; s.onload = s.onerror = ok; document.head.append(s); });
    JOBS = window.JOBS_SNAPSHOT || [];
  }
  $('login').hidden = true; document.querySelector('main').hidden = false;
  JOBS.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  current = current || JOBS[0]?.id;
  $('country').insertAdjacentHTML('beforeend', [...new Set(JOBS.map(j => j.country))].sort().map(c => `<option>${esc(c)}</option>`).join(''));
  render();
}

function filtered() {
  const q = $('q').value.trim().toLowerCase(), c = $('country').value;
  return JOBS.filter(j => (!c || j.country === c) && (!q || [j.title, j.title_uk, j.pay, j.en, j.uk].join(' ').toLowerCase().includes(q)));
}

function render() {
  const list = filtered();
  $('count').textContent = `${list.length} з ${JOBS.length}`;
  $('list').innerHTML = list.length ? list.map(j => `
    <button class="item ${j.id === current ? 'on' : ''}" data-id="${esc(j.id)}">
      <b>${esc(j.title_uk || j.title)}</b><small class="mono">${esc(j.pay)} · ${esc(j.country)} · ${fmt(j.date)}</small>
    </button>`).join('') : '<div class="empty">Нічого не знайдено</div>';

  const j = JOBS.find(j => j.id === current);
  if (!j) { $('detail').innerHTML = '<div class="empty">Оберіть вакансію</div>'; return; }
  const tiles = Object.entries(j.client).map(([k, v]) => `<div class="tile"><span class="mono">${esc(k.toUpperCase())}</span>${esc(v)}</div>`).join('');
  const link = /^https?:\/\//.test(j.url) ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">Відкрити на Upwork ↗</a>` : '';
  $('detail').innerHTML = `
    <div class="top"><h2>${esc(j.title_uk || j.title)}</h2>${link}</div>
    ${j.title_uk ? `<div class="orig">${esc(j.title)}</div>` : ''}
    <div class="meta mono">${esc(j.pay)}${j.proposals ? ` · заявок ${esc(j.proposals)}` : ''} · опубліковано ${fmt(j.date)}</div>
    ${tiles ? `<div class="tiles mono">${tiles}</div>` : ''}
    <div class="cols">
      <section><h3 class="mono">Англійська (оригінал)</h3><p>${esc(j.en)}</p></section>
      <section><h3 class="mono">Українська (переклад)</h3><p>${esc(j.uk)}</p></section>
    </div>`;
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  current = b.dataset.id; history.replaceState(null, '', '#' + current); render();
});
$('q').addEventListener('input', render);
$('country').addEventListener('change', render);
let MARKET = null;
async function loadMarket() {
  if (!MARKET) {
    const get = () => fetch('/api/market', { headers: { Authorization: 'Bearer ' + (store.get()?.access_token || '') } });
    let r = await get();
    if (r.status === 401 && await refresh()) r = await get();
    if (r.status === 401) { store.set(null); return showLogin(); }
    MARKET = r.ok ? await r.json() : { postings: [], state: null };
    $('msrc').insertAdjacentHTML('beforeend', [...new Set(MARKET.postings.map(p => p.source))].sort().map(c => `<option>${esc(c)}</option>`).join(''));
  }
  renderMarket();
}
function renderMarket() {
  const q = $('mq').value.trim().toLowerCase(), src = $('msrc').value;
  const list = MARKET.postings.filter(p => (!src || p.source === src) && (!q || [p.title, p.title_uk, p.company, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q)));
  const st = MARKET.state;
  $('mstate').textContent = `${list.length} з ${MARKET.postings.length}` + (st?.last_run ? ` · оновлено ${new Date(st.last_run).toLocaleString('uk-UA')} · нових за запуск: ${st.last_new ?? 0}` : '');
  $('mlist').innerHTML = list.length ? list.map(p => `
    <a class="post" href="${/^https?:\/\//.test(p.url) ? esc(p.url) : '#'}" target="_blank" rel="noopener">
      <b>${esc(p.title_uk || p.title)}</b>
      <small class="mono">${[p.title_uk ? p.title : '', p.company, p.location, p.salary, p.source, p.posted_at ? fmt(p.posted_at) : ''].filter(Boolean).map(esc).join(' · ')}</small>
      ${(p.matched || []).length ? `<div class="tags">${p.matched.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
    </a>`).join('') : '<div class="empty">Нічого не знайдено</div>';
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t));
  const market = t.dataset.tab === 'market';
  $('upworkView').hidden = market; $('marketView').hidden = !market;
  $('count').style.display = market ? 'none' : '';
  if (market) loadMarket();
});
$('mq').addEventListener('input', () => MARKET && renderMarket());
$('msrc').addEventListener('change', () => MARKET && renderMarket());

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  const r = await auth('token?grant_type=password', { email: $('email').value.trim(), password: $('password').value });
  if (!r.ok) return showLogin('Невірний email або пароль');
  store.set(await r.json()); $('password').value = '';
  const ok = await fetchJobs();
  if (!ok.ok) { store.set(null); return showLogin('Доступ лише для власника'); }
  load();
});
$('logout').addEventListener('click', () => { store.set(null); location.reload(); });
load();
</script>
</body>
</html>
